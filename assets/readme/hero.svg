<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">v-ranger</title>
  <desc id="hero-desc">A colourful, emotive range slider component for Vue 3, shown as a gradient track running from angry to blush with the thumb resting on "Astonished".</desc>

  <defs>
    <linearGradient id="moodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffc300"/>
      <stop offset="20%"  stop-color="#ffb0fe"/>
      <stop offset="40%"  stop-color="#ff6bd6"/>
      <stop offset="60%"  stop-color="#ff9d76"/>
      <stop offset="80%"  stop-color="#51eaea"/>
      <stop offset="100%" stop-color="#fb3569"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="26" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="72" font-size="20" font-weight="600" letter-spacing="2.5"
          fill="#a3a3a3">VUE 3 &#183; ACCESSIBLE RANGE COMPONENT</text>

    <text x="62" y="176" font-size="72" font-weight="800" fill="#fafafa">v-ranger</text>

    <rect x="64" y="226" width="200" height="8" rx="4" fill="url(#moodGrad)"/>

    <text x="64" y="276" font-size="26" font-weight="600" fill="#e5e5e5">Express a choice &#8212; not just a number.</text>
    <text x="64" y="312" font-size="20" fill="#a3a3a3">Colourful, emotive, accessible.</text>
    <text x="64" y="344" font-size="20" fill="#a3a3a3">Real &lt;input type=&quot;range&quot;&gt; underneath.</text>

    <g id="metadata-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#a3a3a3">
      <rect x="64" y="376" width="66" height="30" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1"/>
      <text x="97" y="396" text-anchor="middle">MIT</text>

      <rect x="142" y="376" width="118" height="30" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1"/>
      <text x="201" y="396" text-anchor="middle">0 deps</text>

      <rect x="272" y="376" width="146" height="30" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1"/>
      <text x="345" y="396" text-anchor="middle">WCAG 2.2 AA</text>
    </g>
  </g>

  <g id="install-chip" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#d4d4d4">
    <rect x="962" y="34" width="174" height="34" rx="17" fill="none" stroke="#2b2b2b" stroke-width="1"/>
    <text x="1049" y="56" text-anchor="middle">npm i v-ranger</text>
  </g>

  <g id="project-proof">
    <text x="900" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#737373">&lt;Ranger gradient=&quot;mood&quot; :stops /&gt;</text>

    <text x="866" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#fafafa">Astonished</text>

    <rect x="730" y="262" width="340" height="13" rx="6.5" fill="url(#moodGrad)"/>

    <circle cx="730"  cy="268.5" r="4" fill="#fafafa" opacity="0.6"/>
    <circle cx="798"  cy="268.5" r="4" fill="#fafafa" opacity="0.6"/>
    <circle cx="934"  cy="268.5" r="4" fill="#fafafa" opacity="0.6"/>
    <circle cx="1002" cy="268.5" r="4" fill="#fafafa" opacity="0.6"/>
    <circle cx="1070" cy="268.5" r="4" fill="#fafafa" opacity="0.6"/>

    <circle cx="866" cy="268.5" r="17" fill="#ff6bd6" opacity="0.16"/>
    <circle cx="866" cy="268.5" r="11" fill="#ff6bd6" stroke="#fafafa" stroke-width="2.5"/>

    <g font-size="19" text-anchor="middle" opacity="0.75">
      <text x="730"  y="318">😠</text>
      <text x="798"  y="318">😑</text>
      <text x="934"  y="318">😖</text>
      <text x="1002" y="318">🤨</text>
      <text x="1070" y="318">😊</text>
    </g>
    <text x="866" y="322" text-anchor="middle" font-size="29">😲</text>
  </g>
</svg>
