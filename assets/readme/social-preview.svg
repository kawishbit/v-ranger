<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">v-ranger</title>
  <desc id="sp-desc">GitHub social preview for v-ranger: a colourful, emotive range slider component for Vue 3, shown as a gradient track with the thumb resting on "Astonished".</desc>

  <defs>
    <linearGradient id="moodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffc300"/>
      <stop offset="20%"  stop-color="#ffb0fe"/>
      <stop offset="40%"  stop-color="#ff6bd6"/>
      <stop offset="60%"  stop-color="#ff9d76"/>
      <stop offset="80%"  stop-color="#51eaea"/>
      <stop offset="100%" stop-color="#fb3569"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="96" y="150" font-size="22" font-weight="600" letter-spacing="2.75"
          fill="#a3a3a3">VUE 3 &#183; ACCESSIBLE RANGE COMPONENT</text>

    <text x="92" y="270" font-size="104" font-weight="800" fill="#fafafa">v-ranger</text>

    <rect x="96" y="310" width="260" height="10" rx="5" fill="url(#moodGrad)"/>

    <text x="96" y="378" font-size="30" font-weight="600" fill="#e5e5e5">Express a choice &#8212; not just a number.</text>
    <text x="96" y="420" font-size="22" fill="#a3a3a3">Colourful, emotive, accessible.</text>
    <text x="96" y="454" font-size="22" fill="#a3a3a3">Real &lt;input type=&quot;range&quot;&gt; underneath.</text>

    <g id="metadata-chips" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#a3a3a3">
      <rect x="96" y="490" width="74" height="36" rx="18" fill="none" stroke="#2b2b2b" stroke-width="1.25"/>
      <text x="133" y="514" text-anchor="middle">MIT</text>

      <rect x="184" y="490" width="122" height="36" rx="18" fill="none" stroke="#2b2b2b" stroke-width="1.25"/>
      <text x="245" y="514" text-anchor="middle">0 deps</text>

      <rect x="320" y="490" width="160" height="36" rx="18" fill="none" stroke="#2b2b2b" stroke-width="1.25"/>
      <text x="400" y="514" text-anchor="middle">WCAG 2.2 AA</text>
    </g>
  </g>

  <g id="install-chip" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#d4d4d4">
    <rect x="990" y="96" width="194" height="40" rx="20" fill="none" stroke="#2b2b2b" stroke-width="1.25"/>
    <text x="1087" y="122" text-anchor="middle">npm i v-ranger</text>
  </g>

  <g id="project-proof">
    <text x="990" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" fill="#737373">&lt;Ranger gradient=&quot;mood&quot; :stops /&gt;</text>

    <text x="952" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="600" fill="#fafafa">Astonished</text>

    <rect x="800" y="326" width="380" height="15" rx="7.5" fill="url(#moodGrad)"/>

    <circle cx="800"  cy="333.5" r="4.5" fill="#fafafa" opacity="0.6"/>
    <circle cx="876"  cy="333.5" r="4.5" fill="#fafafa" opacity="0.6"/>
    <circle cx="1028" cy="333.5" r="4.5" fill="#fafafa" opacity="0.6"/>
    <circle cx="1104" cy="333.5" r="4.5" fill="#fafafa" opacity="0.6"/>
    <circle cx="1180" cy="333.5" r="4.5" fill="#fafafa" opacity="0.6"/>

    <circle cx="952" cy="333.5" r="20" fill="#ff6bd6" opacity="0.16"/>
    <circle cx="952" cy="333.5" r="13" fill="#ff6bd6" stroke="#fafafa" stroke-width="3"/>

    <g font-size="22" text-anchor="middle" opacity="0.75">
      <text x="800"  y="392">😠</text>
      <text x="876"  y="392">😑</text>
      <text x="1028" y="392">😖</text>
      <text x="1104" y="392">🤨</text>
      <text x="1180" y="392">😊</text>
    </g>
    <text x="952" y="398" text-anchor="middle" font-size="34">😲</text>
  </g>
</svg>
